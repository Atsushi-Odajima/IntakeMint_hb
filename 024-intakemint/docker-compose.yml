# Local production-like stack: app + PostgreSQL 16 (+ optional ClamAV). Not a deployment.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: intakemint, POSTGRES_PASSWORD: devpass, POSTGRES_DB: intakemint }
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://intakemint:devpass@db:5432/intakemint
      STORAGE_DIR: /data/objects
    volumes: [objects:/data/objects]
    ports: ["8787:8787"]
    depends_on: [db]
  # clamav:
  #   image: clamav/clamav:stable   # GPLv2, runs as a separate service (not linked into IntakeMint)
volumes: { pgdata: {}, objects: {} }
